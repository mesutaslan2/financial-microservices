version: '3.8'

services:
  auth_service:
    build: .
    command: python -m uvicorn auth_service.main:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"

  transaction_service:
    build: .
    command: python -m uvicorn transaction_service.main:app --host 0.0.0.0 --port 8002
    ports:
      - "8002:8002"
    depends_on:
      - fraud_service

  fraud_service:
    build: .
    command: python -m uvicorn fraud_service.main:app --host 0.0.0.0 --port 8003
    ports:
      - "8003:8003"